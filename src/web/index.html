<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>校园报修智能分派</title>
<style>
  :root{
    --bg:#f6f7f9; --card:#fff; --ink:#1a1d21; --muted:#6b7280;
    --line:#e5e7eb; --blue:#2563eb; --blue-weak:#eff4ff;
    --p0:#dc2626; --p1:#d97706; --p2:#64748b;
  }
  *{box-sizing:border-box}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font:15px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;
  }
  .wrap{max-width:780px;margin:0 auto;padding:28px 18px 64px}
  header{margin-bottom:18px}
  h1{font-size:22px;margin:0 0 6px;letter-spacing:-.01em}
  .sub{color:var(--muted);font-size:13.5px;margin:0}
  .badge{
    display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;
    background:var(--blue-weak);color:var(--blue);margin-left:8px;vertical-align:middle;
  }
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px}
  label{display:block;font-size:13.5px;font-weight:600;margin-bottom:8px}
  textarea{
    width:100%;min-height:104px;resize:vertical;padding:12px;border:1px solid var(--line);
    border-radius:9px;font:inherit;outline:none;transition:border-color .15s;
  }
  textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.1)}
  .row{display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:12px;flex-wrap:wrap}
  .counter{font-size:12.5px;color:var(--muted)}
  .counter.over{color:var(--p0);font-weight:600}
  button{
    font:inherit;font-weight:600;border:none;border-radius:9px;padding:10px 20px;
    cursor:pointer;transition:opacity .15s,transform .05s;
  }
  button:active{transform:translateY(1px)}
  button:disabled{opacity:.55;cursor:not-allowed}
  .primary{background:var(--blue);color:#fff}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
  .chip{
    font-size:12.5px;padding:5px 11px;border-radius:999px;border:1px solid var(--line);
    background:#fafafa;color:#374151;cursor:pointer;transition:all .15s;
  }
  .chip:hover{border-color:var(--blue);color:var(--blue);background:var(--blue-weak)}
  .chip.warn{border-style:dashed}
  details{margin-top:14px;font-size:13.5px;color:var(--muted)}
  details summary{cursor:pointer;color:var(--blue);font-weight:500}
  details ul{margin:8px 0 0;padding-left:20px}
  details li{margin:3px 0}

  /* 结果区 */
  #result{display:none}
  .verdict{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap}
  .big{font-size:26px;font-weight:700;letter-spacing:-.02em}
  .group{color:var(--muted);font-size:13.5px;margin-top:2px}
  .ugr{
    margin-left:auto;padding:6px 14px;border-radius:999px;color:#fff;
    font-weight:700;font-size:14px;white-space:nowrap;
  }
  .ugr small{display:block;font-weight:500;font-size:11.5px;opacity:.9}
  .bars{margin-top:18px;display:grid;gap:10px}
  .bar-row{display:grid;grid-template-columns:88px 1fr 52px;align-items:center;gap:10px;font-size:13px}
  .track{height:7px;background:#eef1f5;border-radius:999px;overflow:hidden}
  .fill{height:100%;background:var(--blue);border-radius:999px;transition:width .5s ease}
  .fill.warn{background:var(--p1)}
  .top3{margin-top:16px;padding-top:14px;border-top:1px dashed var(--line);font-size:13px;color:var(--muted)}
  .top3 b{color:var(--ink);font-weight:600}
  .alert{
    margin-top:16px;padding:11px 14px;border-radius:9px;font-size:13.5px;
    background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;
  }
  .alert strong{display:block;margin-bottom:2px}
  #error{
    display:none;padding:11px 14px;border-radius:9px;font-size:13.5px;
    background:#fef2f2;border:1px solid #fecaca;color:#991b1b;margin-bottom:16px;
  }
  .spinner{
    display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.4);
    border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;
    vertical-align:-2px;margin-right:6px;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  .hist{margin-top:22px}
  .hist h3{font-size:13px;color:var(--muted);font-weight:600;margin:0 0 8px}
  .hist-item{
    font-size:13px;padding:9px 12px;border-radius:8px;background:#fff;
    border:1px solid var(--line);margin-bottom:6px;display:flex;gap:10px;align-items:center;
  }
  .hist-item .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#374151}
  .tag{font-size:11.5px;padding:1px 7px;border-radius:5px;background:var(--blue-weak);color:var(--blue);white-space:nowrap}
  footer{margin-top:28px;font-size:12px;color:var(--muted);text-align:center;line-height:1.8}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>校园报修智能分派 <span class="badge" id="modelBadge">加载中…</span></h1>
    <p class="sub">粘贴一条报修工单，自动判断该派给哪个班组、有多急。</p>
  </header>

  <div class="card">
    <label for="text">工单内容</label>
    <textarea id="text" placeholder="例如：3 号楼 502 卫生间水管接口漏水，地上已经积了一层水"></textarea>
    <div class="row">
      <span class="counter" id="counter">0 / 500</span>
      <button class="primary" id="btn">开始分派</button>
    </div>

    <div class="chips" id="chips"></div>

    <details>
      <summary>使用说明与局限</summary>
      <ul>
        <li>输入用户原话即可，<b>不用整理格式</b>，错别字和口语都不影响。</li>
        <li>一次分析一条；分批处理建议使用接口 /api/predict/batch。</li>
        <li>置信度低于阈值时会提示"建议人工复核"，请不要直接照单派工。</li>
        <li>当前模型只用 <b>646 条合成数据</b>训练，真实场景准确率会低于离线指标，属于实验性系统。</li>
      </ul>
    </details>
  </div>

  <div id="error"></div>
  <div class="card" id="result"></div>

  <div class="hist" id="hist" style="display:none">
    <h3>本次会话最近 5 条</h3>
    <div id="histList"></div>
  </div>

  <footer>
    模型：TF-IDF + SVM · 数据：合成工单 646 条 · 仅供教学演示<br>
    紧急工单请以人工判断为准
  </footer>
</div>

<script>
const $ = s => document.querySelector(s);
const ta = $('#text'), btn = $('#btn'), counter = $('#counter');

const URG_COLOR = {P0:'#dc2626', P1:'#d97706', P2:'#64748b'};

const SAMPLES = [
  {t:'3号楼502卫生间水管接口漏水，地上已经积了一层水', hint:false},
  {t:'宿舍空调吹出来是热风，晚上热得睡不着', hint:false},
  {t:'请问报修一般多久能上门，已经等了两天了', hint:false},
  {t:'走廊的灯不亮了，晚上走路看不见', hint:false},
  {t:'墙里的电线有焦味', hint:true},
];

SAMPLES.forEach(s => {
  const b = document.createElement('span');
  b.className = 'chip' + (s.hint ? ' warn' : '');
  b.textContent = s.hint ? '⚠ 试试这句（模型很可能判错）' : s.t.slice(0, 16) + '…';
  b.title = s.t;
  b.onclick = () => { ta.value = s.t; updateCounter(); ta.focus(); };
  $('#chips').appendChild(b);
});

function updateCounter(){
  const n = ta.value.length;
  counter.textContent = `${n} / 500`;
  counter.classList.toggle('over', n > 500);
}

ta.addEventListener('input', updateCounter);
ta.addEventListener('keydown', e => {
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); run(); }
});

function showError(msg){
  const el = $('#error');
  el.textContent = msg;
  el.style.display = 'block';
}
function hideError(){ $('#error').style.display = 'none'; }

function setLoading(on){
  btn.disabled = on;
  btn.innerHTML = on ? '<span class="spinner"></span>分析中…' : '开始分派';
}

async function run(){
  const text = ta.value.trim();
  if (!text) { showError('请先输入工单内容'); return; }
  if (text.length > 500) { showError('内容超过 500 字，请截断后再试'); return; }

  hideError();
  $('#result').style.display = 'none';
  setLoading(true);

  try {
    const r = await fetch('/api/predict', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({text})
    });
    let data;
    try { data = await r.json(); }
    catch { throw new Error('服务返回了非 JSON 内容，请检查后端日志'); }

    if (!r.ok){
      let msg = data.detail;
      if (Array.isArray(msg)) msg = msg.map(d => d.msg).join('；');
      throw new Error(msg || `请求失败（HTTP ${r.status}）`);
    }
    render(data, text);
  } catch (e) {
    showError(e.message.includes('Failed to fetch')
      ? '无法连接服务器，请确认后端已启动'
      : e.message);
  } finally {
    setLoading(false);
  }
}

function render(d, text){
  const c = d.category, u = d.urgency;
  const pct = x => (x * 100).toFixed(1) + '%';

  const top3 = c.top3.map((x, i) =>
    `<span style="color:${i===0?'var(--ink)':'var(--muted)'}">${x.name} ${pct(x.prob)}</span>`
  ).join(' · ');

  const alert = d.needs_review
    ? `<div class="alert"><strong>建议人工复核</strong>${d.review_reasons.join('；')}</div>`
    : (u.code === 'P0'
        ? `<div class="alert"><strong>紧急工单</strong>${d.review_reasons.join('；')}</div>`
        : '');

  $('#result').innerHTML = `
    <div class="verdict">
      <div>
        <div class="big">${c.name}</div>
        <div class="group">建议派给：<b>${c.group}</b></div>
      </div>
      <div class="ugr" style="background:${URG_COLOR[u.code] || '#64748b'}">
        ${u.name}
        <small>${u.sla}</small>
      </div>
    </div>

    <div class="bars">
      <div class="bar-row">
        <span>类别置信度</span>
        <div class="track"><div class="fill ${c.confidence<0.5?'warn':''}" style="width:${c.confidence*100}%"></div></div>
        <span>${pct(c.confidence)}</span>
      </div>
      <div class="bar-row">
        <span>紧急度置信度</span>
        <div class="track"><div class="fill ${u.confidence<0.5?'warn':''}" style="width:${u.confidence*100}%"></div></div>
        <span>${pct(u.confidence)}</span>
      </div>
    </div>

    <div class="top3"><b>候选类别</b>　${top3}</div>
    ${alert}
  `;
  $('#result').style.display = 'block';

  addHistory(text, c.name, u);
}

function addHistory(text, catName, u){
  const box = $('#histList');
  const item = document.createElement('div');
  item.className = 'hist-item';
  item.innerHTML = `<span class="tag" style="background:${(URG_COLOR[u.code]||'#64748b')}1a;color:${URG_COLOR[u.code]||'#64748b'}">${u.code}</span>
                    <span class="tag">${catName}</span>
                    <span class="t" title="${text.replace(/"/g,'&quot;')}">${text}</span>`;
  box.prepend(item);
  while (box.children.length > 5) box.removeChild(box.lastChild);
  $('#hist').style.display = 'block';
}

btn.onclick = run;

// 启动时读一次元信息，把模型名和阈值显示出来
fetch('/api/meta').then(r => r.json()).then(m => {
  $('#modelBadge').textContent = `复核阈值 ${(m.review_threshold*100).toFixed(0)}%`;
}).catch(() => {
  $('#modelBadge').textContent = '后端未连接';
});
</script>
</body>
</html>
